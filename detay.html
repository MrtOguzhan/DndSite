<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Detayı - Dice & Role</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                        handwriting: ['Caveat', 'cursive'], 
                    },
                    colors: {
                        parchmentBase: '#dcb88e',
                        inkDark: '#2c1e16',
                        glassPanel: 'rgba(92, 84, 70, 0.4)', 
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #dcb88e;
            background-image: 
                radial-gradient(circle at center, transparent 0%, #a87e50 100%),
                repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(62, 39, 35, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(62, 39, 35, 0.8); }

        .vintage-card {
            background-color: #eaddc4;
            background-image: radial-gradient(circle at center, transparent 40%, rgba(139, 90, 43, 0.15) 100%);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .vintage-card::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(139, 90, 43, 0.4);
            border-radius: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-inkDark flex flex-col selection:bg-inkDark selection:text-parchmentBase">

    <header class="w-full pt-8 pb-4 text-center relative z-10">
        <a href="index.html" class="absolute left-6 top-8 z-50 cursor-pointer font-cinzel font-bold text-inkDark hover:text-amber-900 flex items-center gap-2 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Geri
        </a>
        
        <h1 id="game-title" class="font-cinzel text-4xl md:text-5xl font-bold tracking-wider drop-shadow-md text-[#3e2723]">
            Oyun Yükleniyor...
        </h1>
        <div class="h-px w-64 mx-auto mt-3 bg-gradient-to-r from-transparent via-[#8b5a2b] to-transparent"></div>
    </header>

    <main class="flex-grow container mx-auto px-6 pb-8 flex flex-col lg:flex-row gap-8 max-w-7xl relative z-10">
        
        <section class="w-full lg:w-2/3 h-[600px] lg:h-[700px] relative rounded-sm shadow-xl flex flex-col">
            <div class="absolute inset-0 bg-glassPanel backdrop-blur-sm border border-[#3e2723]/30 rounded-sm pointer-events-none"></div>
            <textarea 
                class="w-full h-full relative z-10 bg-transparent resize-none p-8 text-xl md:text-2xl font-handwriting text-[#1a110a] placeholder-[#3e2723]/50 focus:outline-none focus:ring-1 focus:ring-[#8b5a2b]/50 custom-scrollbar rounded-sm leading-relaxed" 
                placeholder="Maceranızın notlarını buraya alın..."
            ></textarea>
        </section>

        <aside class="w-full lg:w-1/3 flex items-center justify-center">
            <div class="grid grid-cols-2 gap-4 w-full max-w-[400px]">
                
                <div class="vintage-card aspect-[2/3] rounded-sm cursor-pointer hover:scale-105 transition-transform duration-300 group flex items-center justify-center">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity text-[#8b5a2b] font-cinzel text-sm text-center px-2">Slot 1</div>
                </div>
                <div class="vintage-card aspect-[2/3] rounded-sm cursor-pointer hover:scale-105 transition-transform duration-300 group flex items-center justify-center">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity text-[#8b5a2b] font-cinzel text-sm text-center px-2">Slot 2</div>
                </div>
                <div class="vintage-card aspect-[2/3] rounded-sm cursor-pointer hover:scale-105 transition-transform duration-300 group flex items-center justify-center">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity text-[#8b5a2b] font-cinzel text-sm text-center px-2">Slot 3</div>
                </div>
                <div class="vintage-card aspect-[2/3] rounded-sm cursor-pointer hover:scale-105 transition-transform duration-300 group flex items-center justify-center">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity text-[#8b5a2b] font-cinzel text-sm text-center px-2">Slot 4</div>
                </div>
                <div class="vintage-card aspect-[2/3] rounded-sm cursor-pointer hover:scale-105 transition-transform duration-300 group flex items-center justify-center">
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity text-[#8b5a2b] font-cinzel text-sm text-center px-2">Slot 5</div>
                </div>

                <div class="aspect-[2/3] flex flex-col items-center justify-center gap-4">
                    <div class="w-16 h-16 drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)] hover:-translate-y-1 hover:rotate-12 transition-all duration-300 cursor-pointer text-[#2c1e16]">
                        <svg viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M256 16L34.13 189.65 256 512 477.87 189.65 256 16z" opacity="0.9"/>
                            <path d="M256 16l-85.33 173.65 85.33 111 85.33-111L256 16z" fill="#3e2723"/>
                            <path d="M170.67 189.65L256 300.65v211.35L34.13 189.65h136.54z" fill="#4e342e"/>
                            <path d="M341.33 189.65L256 300.65v211.35l221.87-322.35H341.33z" fill="#5d4037"/>
                            <text x="256" y="210" font-family="Cinzel, serif" font-size="80" font-weight="bold" fill="#eaddc4" text-anchor="middle" dominant-baseline="central">20</text>
                        </svg>
                    </div>

                    <button class="relative group bg-[#dcb88e] border-2 border-[#5c442c] text-[#2c1e16] font-cinzel font-bold text-sm px-4 py-2 rounded-sm shadow-[0_4px_6px_rgba(0,0,0,0.4)] hover:bg-[#eaddc4] hover:shadow-[0_6px_10px_rgba(0,0,0,0.5)] transition-all active:translate-y-1 overflow-hidden">
                        <span class="absolute inset-0 border border-[#5c442c] m-1 rounded-sm pointer-events-none opacity-50 group-hover:opacity-100 transition-opacity"></span>
                        <span class="relative z-10">Seçim oluştur</span>
                    </button>
                </div>

            </div>
        </aside>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const oyunIsmi = urlParams.get('isim');

            if (oyunIsmi) {
                document.getElementById('game-title').innerText = oyunIsmi;
                document.title = oyunIsmi + " - Dice & Role";
            } else {
                document.getElementById('game-title').innerText = "Bilinmeyen Oyun";
            }

            const aktifKullanici = JSON.parse(localStorage.getItem('aktifKullanici'));

            // Eğer giriş yapılmamışsa login sayfasına at
            if (!aktifKullanici) {
                window.location.href = 'login.html';
            } 
            // Eğer giren kişi normal Üye ise, URL'deki isim parametresiyle oyun ekranına fırlat
            else if (aktifKullanici.rol === 'Uye_Girisi') {
                window.location.href = 'oyun-ekrani.html' + window.location.search;
            }
        });
    </script>
</body>
</html>
