<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice & Role</title>
    <link rel="shortcut icon" href="/img/logo.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        parchment: '#1e1b18',
                        gold: '#d4af37',
                        darkGold: '#aa8822',
                        mutedPurple: '#3f3545',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a1714;
            background-image: radial-gradient(circle at center, #2a2420 0%, #120f0c 100%);
        }
        .ornate-borders::before, .ornate-borders::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .ornate-borders::before {
            top: 8px; left: 8px;
            border-top-color: inherit;
            border-left-color: inherit;
        }
        .ornate-borders::after {
            bottom: 8px; right: 8px;
            border-bottom-color: inherit;
            border-right-color: inherit;
        }
    </style>
</head>
<body class="font-inter text-gray-300 min-h-screen selection:bg-gold selection:text-black">

    <header class="sticky top-0 z-50 bg-[#120f0c]/90 backdrop-blur-md border-b border-darkGold/30 shadow-[0_4px_20px_rgba(0,0,0,0.5)] px-6 py-4 flex justify-between items-center transition-all">
        <div class="font-cinzel text-3xl font-bold tracking-wider text-gold drop-shadow-md cursor-pointer hover:text-white transition-colors duration-300">
            Dice<span class="text-gray-400 text-2xl">&</span>Role
        </div>
        <div class="flex items-center gap-6">
            <button class="flex items-center gap-2 hover:text-gold transition-colors font-semibold tracking-wide">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                TR
            </button>
            <a href="profile.html">
                <button class="hover:text-gold transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </button>
            </a>
            <button class="hover:text-gold transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 justify-items-center">

            <a href="newgame.html?isim=Yeni Oyun" class="group relative w-full max-w-[280px] aspect-[2/3] rounded-sm cursor-pointer transition-all duration-500 hover:-translate-y-2 flex flex-col items-center justify-center p-6 border-2 border-dashed border-gray-600 hover:border-gold hover:shadow-[0_0_20px_rgba(212,175,55,0.15)] bg-transparent hover:bg-gold/5 block decoration-transparent">
                <div class="w-16 h-16 mb-6 rounded-full border-2 border-gray-600 group-hover:border-gold flex items-center justify-center transition-all duration-500 group-hover:scale-110 shadow-inner">
                    <svg class="w-8 h-8 text-gray-500 group-hover:text-gold transition-colors duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </div>
                <div class="relative z-20 text-center">
                    <h2 class="font-cinzel text-xl font-bold text-gray-400 group-hover:text-gold transition-colors duration-500">Yeni Oyun</h2>
                    <div class="h-px w-1/2 mx-auto bg-gray-600 group-hover:bg-gold transition-colors duration-500 mt-2 mb-2"></div>
                    <p class="text-gray-500 group-hover:text-gold/70 text-sm tracking-widest uppercase transition-colors duration-500">Oluştur</p>
                </div>
            </a>

            <a href="detay.html?isim=Baldur's Gate 3" class="group relative w-full max-w-[280px] aspect-[2/3] bg-black rounded-sm cursor-pointer transition-all duration-500 hover:-translate-y-2 hover:scale-105 hover:shadow-[0_0_30px_rgba(212,175,55,0.4)] shadow-[0_0_15px_rgba(212,175,55,0.2)] flex flex-col justify-end p-6 border border-gold border-opacity-70 ornate-borders border-t-gold border-l-gold border-r-gold border-b-gold block decoration-transparent">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent z-10 pointer-events-none"></div>
                <div class="absolute inset-1 bg-zinc-900 z-0"></div>
                <div class="relative z-20 text-center transform transition-transform duration-300 group-hover:translate-y-[-10px]">
                    <h2 class="font-cinzel text-2xl font-bold text-white mb-2 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">Baldur's Gate 3</h2>
                    <div class="h-px w-3/4 mx-auto bg-gradient-to-r from-transparent via-gold to-transparent mb-2"></div>
                    <p class="text-gold text-sm tracking-widest font-semibold uppercase">RPG</p>
                </div>
            </a>

            <a href="detay.html?isim=Teamfight Tactics" class="group relative w-full max-w-[280px] aspect-[2/3] bg-mutedPurple/80 rounded-sm cursor-pointer transition-all duration-500 hover:-translate-y-2 hover:shadow-xl flex flex-col justify-end p-6 border border-gray-600/50 hover:border-gray-400 ornate-borders border-t-gray-500 border-l-gray-500 border-r-gray-500 border-b-gray-500 block decoration-transparent">
                <div class="absolute inset-0 bg-gradient-to-t from-[#1a1714] via-[#1a1714]/60 to-transparent z-10 pointer-events-none"></div>
                <div class="relative z-20 text-center opacity-70 group-hover:opacity-100 transition-opacity duration-300">
                    <h2 class="font-cinzel text-xl font-bold text-gray-200 mb-2">Teamfight Tactics</h2>
                    <div class="h-px w-3/4 mx-auto bg-gray-600 mb-2"></div>
                    <p class="text-gray-400 text-sm tracking-widest uppercase">Auto Battler</p>
                </div>
            </a>

            <a href="detay.html?isim=Elden Ring" class="group relative w-full max-w-[280px] aspect-[2/3] bg-mutedPurple/80 rounded-sm cursor-pointer transition-all duration-500 hover:-translate-y-2 hover:shadow-xl flex flex-col justify-end p-6 border border-gray-600/50 hover:border-gray-400 ornate-borders border-t-gray-500 border-l-gray-500 border-r-gray-500 border-b-gray-500 block decoration-transparent">
                <div class="absolute inset-0 bg-gradient-to-t from-[#1a1714] via-[#1a1714]/60 to-transparent z-10 pointer-events-none"></div>
                <div class="relative z-20 text-center opacity-70 group-hover:opacity-100 transition-opacity duration-300">
                    <h2 class="font-cinzel text-xl font-bold text-gray-200 mb-2">Elden Ring</h2>
                    <div class="h-px w-3/4 mx-auto bg-gray-600 mb-2"></div>
                    <p class="text-gray-400 text-sm tracking-widest uppercase">Aksiyon RPG</p>
                </div>
            </a>

        </div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Grid alanını seçiyoruz
            const gridContainer = document.querySelector('.grid');
            
            // Tarayıcı hafızasından kayıtlı oyunları çekiyoruz
            let kayitliOyunlar = JSON.parse(localStorage.getItem('oyunlar')) || [];

            // Her bir oyun için yeni bir kart oluşturup grid'e ekliyoruz
            kayitliOyunlar.forEach(oyun => {
                const kartHTML = `
                <a href="detay.html?isim=${encodeURIComponent(oyun.isim)}" class="group relative w-full max-w-[280px] aspect-[2/3] bg-mutedPurple/80 rounded-sm cursor-pointer transition-all duration-500 hover:-translate-y-2 hover:shadow-xl flex flex-col justify-end p-6 border border-gray-600/50 hover:border-gray-400 ornate-borders border-t-gray-500 border-l-gray-500 border-r-gray-500 border-b-gray-500 block decoration-transparent">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1a1714] via-[#1a1714]/60 to-transparent z-10 pointer-events-none"></div>
                    <div class="relative z-20 text-center opacity-70 group-hover:opacity-100 transition-opacity duration-300">
                        <h2 class="font-cinzel text-xl font-bold text-gray-200 mb-2">${oyun.isim}</h2>
                        <div class="h-px w-3/4 mx-auto bg-gray-600 mb-2"></div>
                        <p class="text-gray-400 text-sm tracking-widest uppercase">${oyun.tur}</p>
                    </div>
                </a>
                `;
                gridContainer.insertAdjacentHTML('beforeend', kartHTML);
            });
        });
    </script>
</body>
</html>
